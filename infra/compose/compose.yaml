# Local / single-server pilot stack. Pin image digests for production.
name: ksl-bridge
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ksl}
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow:/mlflow]
  gateway:
    build: {context: ../.., dockerfile: infra/docker/gateway.Dockerfile}
    env_file: ../../.env
    environment:
      KSL_DATABASE_URL: postgresql+asyncpg://ksl_app_login:${KSL_APP_DB_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-ksl}
      KSL_REDIS_URL: redis://redis:6379/0
      KSL_S3_ENDPOINT: http://minio:9000
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
    ports: ["8000:8000"]
  worker-cpu:
    build: {context: ../.., dockerfile: infra/docker/gateway.Dockerfile}
    command: ["uv", "run", "--no-dev", "python", "-m", "workers.translate_worker"]
    env_file: ../../.env
    environment: {KSL_REDIS_URL: "redis://redis:6379/0", KSL_DATABASE_URL_SYNC: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ksl}"}
    depends_on: [redis, postgres]
  worker-production:
    build: {context: ../.., dockerfile: infra/docker/gateway.Dockerfile}
    command: ["uv", "run", "--no-dev", "python", "-m", "workers.production_worker"]
    env_file: ../../.env
    environment: {KSL_REDIS_URL: "redis://redis:6379/0", KSL_DATABASE_URL_SYNC: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ksl}"}
    depends_on: [redis, postgres]
  worker-sign:
    build: {context: ../.., dockerfile: infra/docker/worker-gpu.Dockerfile}
    command: ["uv", "run", "--no-dev", "python", "-m", "workers.sign_worker"]
    env_file: ../../.env
    environment: {KSL_REDIS_URL: "redis://redis:6379/0", KSL_WORKER_DEVICE: cuda, KSL_DATABASE_URL_SYNC: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ksl}"}
    depends_on: [redis, postgres]
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
volumes: {pg: {}, minio: {}, mlflow: {}}
