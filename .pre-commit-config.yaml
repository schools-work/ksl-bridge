repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (module boundaries)
        entry: lint-imports
        language: system
        pass_filenames: false
      - id: contracts-drift
        name: contracts drift check
        entry: python contracts/codegen/gen_python.py --check
        language: system
        pass_filenames: false
